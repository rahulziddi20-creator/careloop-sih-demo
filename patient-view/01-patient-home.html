<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareLoop · Your day</title><link rel="stylesheet" href="../shared/patient-home.css"></head><body class="patient-home refined-page designed-home"><main class="patient-content"><section class="home-hero"><div class="home-brand"><span>CareLoop</span></div><header class="home-welcome"><div class="welcome-copy"><div class="day-label"><span id="date"></span></div><h1 id="greeting">Hello.</h1><p id="welcome-note" class="welcome-note">A good day, at your pace.</p><time id="home-time" class="home-time"></time></div></header></section><p class="patient-prompt" id="home-prompt">What would you like to do?</p><div class="activity-grid">
<wa-button class="activity-card medicine" appearance="outlined" onclick="go('02-medication-reminder.html','02')"><span class="activity-art" aria-hidden="true"></span><span class="activity-content"><span class="activity-icon"><i data-lucide="pill"></i></span><span class="activity-label" data-label="medication">My medicines</span><i class="activity-arrow" data-lucide="chevron-right"></i></span></wa-button><wa-button class="activity-card games" appearance="outlined" onclick="go('03-cognitive-games-hub.html','03')"><span class="activity-art" aria-hidden="true"></span><span class="activity-content"><span class="activity-icon"><i data-lucide="gamepad-2"></i></span><span class="activity-label" data-label="games">Play a game</span><i class="activity-arrow" data-lucide="chevron-right"></i></span></wa-button><wa-button class="activity-card family" appearance="outlined" onclick="go('06-one-touch-family-calling.html','06')"><span class="activity-art" aria-hidden="true"></span><span class="activity-content"><span class="activity-icon"><i data-lucide="phone"></i></span><span class="activity-label" data-label="familyCalling">Call family</span><i class="activity-arrow" data-lucide="chevron-right"></i></span></wa-button><wa-button class="activity-card photos" appearance="outlined" onclick="go('05-family-memory-carousel.html','05')"><span class="activity-art" aria-hidden="true"></span><span class="activity-content"><span class="activity-icon"><i data-lucide="images"></i></span><span class="activity-label" data-label="familyPhotos">Family photos</span><i class="activity-arrow" data-lucide="chevron-right"></i></span></wa-button></div><wa-button class="home-voice" onclick="go('07-voice-assistant-overlay.html','07')"><span class="home-voice-content"><span class="voice-symbol"><i data-lucide="mic"></i></span><span id="talk-button">Talk to CareLoop</span><i data-lucide="chevron-right"></i></span></wa-button></main><script src="../shared/translations.js"></script><script>
const name=CareLoopStorage.getItem('careloop_patient_name');document.getElementById('greeting').textContent=name?'Hello, '+name.split(' ')[0]+'.':'What would you like to do?';document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});function go(file,id){parent.patientNav(file,id)}function theme(t){document.documentElement.classList.toggle('light',t==='light')}theme(CareLoopStorage.getItem('careloop_theme'));addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='themeChange')theme(e.data.theme)});
let currentLanguage='en';function updateTime(){const now=new Date();document.getElementById('home-time').textContent=now.toLocaleTimeString(currentLanguage,{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString(currentLanguage,{weekday:'long',day:'numeric',month:'long'});}setInterval(updateTime,30000);function language(code){currentLanguage=code;updateTime();const t=window.CARELOOP_TRANSLATIONS?.[code]||window.CARELOOP_TRANSLATIONS.en;document.documentElement.lang=code;document.getElementById('welcome-note').textContent=code==='hi'?'एक अच्छा दिन, अपनी रफ़्तार से।':'A good day, at your pace.';document.getElementById('home-prompt').textContent=code==='hi'?'आप क्या करना चाहेंगे?':'What would you like to do?';document.querySelectorAll('[data-label]').forEach(el=>el.textContent=t[el.dataset.label]);if(code==='en'){const labels={medication:'Medicines',games:'Games',familyCalling:'Call family',familyPhotos:'Photos'};document.querySelectorAll('[data-label]').forEach(el=>el.textContent=labels[el.dataset.label]);}document.getElementById('greeting').textContent=(t[new Date().getHours()<12?'greetingMorning':new Date().getHours()<17?'greetingAfternoon':'greetingEvening']||'Hello')+(name?', '+name.split(' ')[0]:'')+'.';document.getElementById('talk-button').textContent=code==='hi'?'बात करें':code==='en'?'Talk to CareLoop':t.askAssistant;try{document.getElementById('date').textContent=new Date().toLocaleDateString(code,{weekday:'long',day:'numeric',month:'long'});}catch{}}language(CareLoopStorage.getItem('careloop_lang')||'en');addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='languageChange')language(e.data.code)});
</script></body></html>
