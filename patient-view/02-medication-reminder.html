<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareLoop · Medicines</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#223d36;font:18px/1.5 Inter,system-ui,sans-serif}main{max-width:780px;margin:auto;padding:26px 22px 40px}h1{font-size:29px;margin:0 0 22px;letter-spacing:-.6px}.calendar{background:white;border:1px solid #dce6e1;border-radius:20px;padding:14px 10px 18px}.week-bar{display:flex;align-items:center;gap:4px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1;gap:3px}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #17695b;outline-offset:3px}.day{background:transparent;color:#5d7269;min-height:68px;display:flex;align-items:center;flex-direction:column;gap:8px;border-radius:12px;padding:6px 0}.day small{font-size:12px}.day strong{font-size:18px;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:600}.day[aria-pressed="true"]{color:#17695b;background:#edf5f0}.day[aria-pressed="true"] strong{background:#17695b;color:white}.arrow{width:32px;min-height:48px;background:transparent;color:#597568;font-size:27px}.date-label{text-align:center;font-size:18px;color:#17695b;margin:14px 0 0;font-weight:600}.today-link{display:block;background:transparent;color:#17695b;text-decoration:underline;margin:12px auto 0;min-height:44px}.summary{font-size:15px;color:#61786d;margin:22px 2px 6px}.time-group{margin-top:24px}.time{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:600;margin:0 0 12px;font-variant-numeric:tabular-nums}.time:before{content:'';width:8px;height:8px;border-radius:50%;background:#73a18d}.medicine{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:16px;background:white;border:1px solid #dce6e1;border-radius:17px;padding:20px;margin:10px 0}.pill{width:44px;height:44px;flex-shrink:0;border-radius:13px;background:#edf5f0;color:#438269;display:grid;place-items:center}.pill svg{width:26px;height:26px}.details{flex:1;min-width:0}.details h3{margin:0 0 5px;font-size:20px;font-weight:600;overflow-wrap:anywhere}.details p{margin:3px 0;font-size:16px;color:#667c70;overflow-wrap:anywhere}.details .note{font-size:15px}.taken{background:#eef6f0;border-color:#bbd6c5}.take{background:#17695b;color:white;border-radius:12px;padding:12px 16px;min-height:48px;font-size:16px;font-weight:600}.take:disabled{background:#e2eee6;color:#3d7055;cursor:default}.empty{padding:42px 20px;text-align:center;color:#657c70;background:white;border:1px solid #dce6e1;border-radius:18px;margin-top:24px}#feedback{font-size:16px;color:#276b4d;min-height:24px;margin:12px 0} @media(max-width:500px){main{padding:22px 14px}.medicine{padding:17px 14px;gap:12px;grid-template-columns:44px minmax(0,1fr);align-items:start}.medicine .take{grid-column:1/-1;width:100%;margin:0}.medicine .details{width:100%}.details h3{font-size:19px}.arrow{width:25px}.day strong{width:30px;height:30px}.day small{font-size:11px}}
</style></head><body class="section-medicine"><main><h1 id="title">My medicines</h1><section class="calendar" aria-label="Medication calendar"><div class="week-bar"><button class="arrow" id="prev" aria-label="Previous week">‹</button><div class="week" id="week"></div><button class="arrow" id="next" aria-label="Next week">›</button></div><p class="date-label" id="date-label"></p><button class="today-link" id="today" hidden>Back to today</button></section><p class="summary" id="summary"></p><div id="schedule"></div><p id="feedback" role="status"></p></main>
<script type="module">
import {doseTimes,dayKey,isTaken,isDueOn,scheduleRule} from '/careloop-sih-demo/shared/medication-schedule.js';
let selected=new Date(),lang=CareLoopStorage.getItem('careloop_app_language')||CareLoopStorage.getItem('careloop_lang')||'en';
const el=id=>document.getElementById(id),hi=()=>lang==='hi',txt=(en,hindi)=>hi()?hindi:en;
function meds(){try{return JSON.parse(CareLoopStorage.getItem('careloop_medications')||'[]').filter(m=>m.status!=='Paused'&&m.regimenStatus!=='Paused')}catch{return []}}
function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const today=dayKey(new Date()),date=dayKey(selected),isToday=date===today;document.documentElement.lang=lang;el('title').textContent=txt('My medicines','मेरी दवाइयाँ');const start=new Date(selected);start.setDate(start.getDate()-((start.getDay()+6)%7));el('week').replaceChildren();for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=node('button',null,'day');b.setAttribute('aria-pressed',String(dayKey(d)===date));b.setAttribute('aria-label',d.toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long'}));b.append(node('small',d.toLocaleDateString(lang,{weekday:'short'})),node('strong',d.toLocaleDateString(lang,{day:'numeric'})));b.onclick=()=>{selected=d;render()};el('week').append(b)}el('date-label').textContent=(isToday?txt('Today, ','आज, '):'')+selected.toLocaleDateString(lang,{day:'numeric',month:'long'});el('today').hidden=isToday;el('today').textContent=txt('Back to today','आज पर लौटें');
 const rows=meds().filter(m=>['unsupported','prn'].includes(scheduleRule(m).kind)||isDueOn(m,new Date(date+'T12:00:00'))).flatMap(m=>{const times=doseTimes(m);return (times.length?times:['']).map(time=>({m,time}))}).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));const done=rows.filter(r=>isTaken(r.m,date,r.time)).length;
 el('summary').textContent=isToday?txt(`${done} of ${rows.length} doses marked taken`,`${rows.length} में से ${done} खुराक ली गई`):txt('Current routine for this day · not a historical record','इस दिन की मौजूदा दिनचर्या · पुराना रिकॉर्ड नहीं');el('schedule').replaceChildren();el('feedback').textContent='';
 if(!rows.length){el('schedule').append(node('p',txt('No medicines added. Your caregiver can add your prescribed schedule.','अभी दवाइयाँ नहीं जोड़ी गई हैं। केयरगिवर आपकी दवाओं का समय जोड़ सकते हैं।'),'empty'));return}
 let previous=null,group;for(const {m,time}of rows){if(previous!==time){group=node('section',null,'time-group');group.append(node('h2',time||txt('Time not set','समय तय नहीं'),'time'));el('schedule').append(group);previous=time}
 const taken=isToday&&isTaken(m,date,time),card=node('article',null,'medicine'+(taken?' taken':'')),icon=node('span',null,'pill');icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m10 4-6 6a5 5 0 0 0 7 7l6-6a5 5 0 0 0-7-7Z"/><path d="m7 7 7 7"/></svg>';const details=node('div',null,'details');details.append(node('h3',m.name||m.shortName||txt('Medicine','दवा')),node('p',m.dosage||txt('See prescription','पर्चा देखें')));if(m.instructions)details.append(node('p',m.instructions,'note'));if(!time)details.append(node('p',m.schedule||m.frequency||txt('Ask your caregiver for the time.','समय के लिए केयरगिवर से पूछें।'),'note'));card.append(icon,details);
 if(isToday){const b=node('button',taken?txt('✓ Taken','✓ ले ली'):txt('Mark taken','ले ली'),'take');b.disabled=taken;b.onclick=async()=>{b.disabled=true;try{const all=JSON.parse(CareLoopStorage.getItem('careloop_medications')||'[]'),target=all.find(x=>x.id===m.id);if(!target)throw Error(txt('Medicine changed. Please reopen this screen.','दवा बदल गई है। यह स्क्रीन फिर खोलें।'));target.doseTaken={...target.doseTaken,[date+'|'+time]:new Date().toISOString()};const times=doseTimes(target);if((times.length?times:['']).every(t=>isTaken({...target,takenDate:null},date,t)))target.takenDate=date;CareLoopStorage.setItem('careloop_medications',JSON.stringify(all));await CareLoopStorage.flush();parent.postMessage({type:'medicationsUpdated'},location.origin);render();}catch(e){el('feedback').textContent=e.message;b.disabled=false}};card.append(b)}group.append(card)}
}
el('prev').onclick=()=>{selected.setDate(selected.getDate()-7);render()};el('next').onclick=()=>{selected.setDate(selected.getDate()+7);render()};el('today').onclick=()=>{selected=new Date();render()};addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='languageChange'&&e.data.code){lang=e.data.code;render()}if(e.data?.type==='medicationsUpdated')render()});render();
</script></body></html>
