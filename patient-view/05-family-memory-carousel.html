<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><script src="/careloop-sih-demo/shared/pages-family-seed.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareLoop · Family memories</title><link rel="stylesheet" href="../shared/workspace.css"><style>main{padding:24px 18px}h1{font-size:28px}img{width:100%;height:260px;object-fit:cover;border-radius:14px}.card{margin:18px 0}.card h2{margin-top:14px}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px}</style><link rel="stylesheet" href="/careloop-sih-demo/shared/patient-simple.css"></head><body class="section-photos"><main><div class="eyebrow">Familiar faces</div><h1>My family memories</h1><section class="card" id="memory"></section><div class="controls"><button id="previous">Previous</button><span id="position"></span><button id="next">Next</button></div><button class="secondary" id="read" style="margin-top:20px;width:100%">Read name aloud</button></main><script>
const members=JSON.parse(CareLoopStorage.getItem('careloop_family_members')||'[]');let index=0;function render(){const host=document.getElementById('memory');host.replaceChildren();if(!members.length){host.textContent='Your caregiver can add family photos in the Family Vault.';for(const id of['previous','next','read'])document.getElementById(id).disabled=true;return;}const m=members[index];if(m.photoUrl){const image=document.createElement('img');image.src=m.photoUrl;image.alt=m.name;image.onerror=()=>{const note=document.createElement('p');note.textContent='Photo unavailable. Your caregiver can add it again.';image.replaceWith(note)};host.append(image)}else{const note=document.createElement('p');note.textContent='Your caregiver can add a photo here.';host.append(note)}const h=document.createElement('h2');h.textContent=m.name;const p=document.createElement('p');p.textContent=m.relationship;host.append(h,p);document.getElementById('position').textContent=(index+1)+' / '+members.length;}document.getElementById('previous').onclick=()=>{index=(index-1+members.length)%members.length;render()};document.getElementById('next').onclick=()=>{index=(index+1)%members.length;render()};document.getElementById('read').onclick=()=>{if(!('speechSynthesis'in window)){alert('Read-aloud is unavailable in this browser.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(members[index].name+'. '+members[index].relationship);u.rate=.8;speechSynthesis.speak(u)};render();document.documentElement.classList.toggle('light',CareLoopStorage.getItem('careloop_theme')==='light');addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});
</script></body></html>
