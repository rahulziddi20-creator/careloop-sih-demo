<!doctype html>
<html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><script src="/careloop-sih-demo/shared/pages-family-seed.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareLoop · Talk</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#f4f8f7;color:#294d41;font-family:Inter,system-ui,sans-serif}main{height:100%;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:30px}.orb{position:relative;isolation:isolate;width:clamp(190px,48vw,340px);aspect-ratio:1;border:0;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;background:linear-gradient(160deg,#17695b 0%,#529987 38%,#a6cfbd 75%,#d6e8dd 100%);box-shadow:0 0 0 1px #17695b12;transition:none;-webkit-tap-highlight-color:transparent}.orb canvas{display:block;width:100%;height:100%;pointer-events:none}.orb:focus-visible{outline:4px solid #17695b;outline-offset:10px}#status{font-size:18px;line-height:1.6;text-align:center;max-width:350px;min-height:58px;margin:0;color:#536b66}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}</style></head><body><main><button class="orb" id="orb" data-state="idle" aria-label="Tap to talk" aria-pressed="false" aria-describedby="status"><canvas id="orb-flow" width="220" height="220" aria-hidden="true"></canvas></button><p id="status" role="status" aria-live="polite"></p><div id="answer" class="sr-only" aria-live="polite"></div></main>
<script src="/careloop-sih-demo/shared/orb-flow.js" defer></script>
<script>
const orb=document.getElementById('orb'),status=document.getElementById('status');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const native=parent.CareLoopNativeVoice;
let recognition=null,active=false,timer=null,generation=0,controller=null,history=[];
let talkConfig=null;
const configReady=fetch('/careloop-sih-demo/shared/talk-config.json').then(r=>r.ok?r.json():null).then(c=>talkConfig=c).catch(()=>{});
let lang=CareLoopStorage.getItem('careloop_app_language')||CareLoopStorage.getItem('careloop_lang')||'en',hindi=lang==='hi';
function labels(){return {idle:hindi?'बात करने के लिए छुएँ':'Tap to talk',listening:hindi?'मैं सुन रहा हूँ…':'I’m listening…',processing:hindi?'एक पल…':'One moment…',speaking:hindi?'रोकने के लिए छुएँ':'Tap to stop',unsupported:hindi?'यहाँ आवाज़ उपलब्ध नहीं है। केयरगिवर से मदद लें।':'Voice is unavailable here. Ask your caregiver for help.',denied:hindi?'माइक की अनुमति के लिए केयरगिवर से मदद लें।':'Ask your caregiver to allow the microphone.',retry:hindi?'सुनाई नहीं दिया। फिर से छुएँ।':'I couldn’t hear you. Tap to try again.'}}
let words=labels();
function state(value,text){orb.dataset.state=value;status.textContent=text??words[value];orb.setAttribute('aria-pressed',String(active));orb.setAttribute('aria-label',active?(hindi?'बात रोकें':'Stop talking'):words.idle)}
function stop(message){active=false;generation++;clearTimeout(timer);const r=recognition;recognition=null;r?.abort();controller?.abort();controller=null;native?.stop().catch(()=>{});if('speechSynthesis'in window)speechSynthesis.cancel();state('idle',message??words.idle)}
function listen(){if(!active)return;
if(native){const turn=generation;state('listening');native.listen(hindi?'hi-IN':'en-IN').then(result=>{if(active&&turn===generation){state('processing');reply(result.text,turn);}}).catch(e=>{if(active&&turn===generation)stop(e.message||words.retry)});return;}const turn=generation;let received=false,failed=false;const r=new SR();recognition=r;r.lang=hindi?'hi-IN':lang==='en'?'en-IN':lang+'-IN';r.interimResults=false;r.continuous=false;r.onstart=()=>{if(active&&turn===generation)state('listening')};r.onresult=e=>{if(!active||turn!==generation)return;received=true;recognition=null;r.stop();state('processing');reply(e.results[0][0].transcript,turn)};r.onerror=e=>{if(!active||turn!==generation)return;failed=true;stop(e.error==='not-allowed'||e.error==='service-not-allowed'?words.denied:words.retry)};r.onend=()=>{if(active&&turn===generation&&!received&&!failed)stop(words.retry)};try{r.start()}catch{stop(words.retry)}}
async function reply(query,turn){const q=query.toLowerCase();let text,destination;
if(/medicin|dose|tablet|दवा|दवाई/.test(q)){const meds=JSON.parse(CareLoopStorage.getItem('careloop_medications')||'[]').filter(m=>m.status!=='Paused'&&m.regimenStatus!=='Paused');text=meds.length?(hindi?'आपकी दवाओं की सूची खोल रहा हूँ।':'Opening your medicine list.'):(hindi?'अभी कोई दवा नहीं जोड़ी गई है।':'There are no saved medicines yet.');if(meds.length)destination=['02-medication-reminder.html','02'];}
else if(/game|play|खेल/.test(q)){text=hindi?'आपके खेल खोल रहा हूँ।':'Opening your games.';destination=['03-cognitive-games-hub.html','03'];}
else if(/call|family|phone|परिवार|फोन/.test(q)){text=hindi?'परिवार की सूची खोल रहा हूँ। जिसे कॉल करना है उसे छुएँ।':'Opening your family. Tap the person you want to call.';destination=['06-one-touch-family-calling.html','06'];}
else if(/photo|picture|तस्वीर|फोटो/.test(q)){text=hindi?'परिवार की तस्वीरें खोल रहा हूँ।':'Opening your family photos.';destination=['05-family-memory-carousel.html','05'];}
else if(/time|समय|बजे/.test(q)){text=new Date().toLocaleTimeString(hindi?'hi-IN':undefined,{hour:'numeric',minute:'2-digit'});}
else if(/date|day|तारीख|दिन/.test(q)){text=new Date().toLocaleDateString(hindi?'hi-IN':undefined,{weekday:'long',day:'numeric',month:'long'});}
else if(/hello|hi\b|नमस्ते|हैलो/.test(q)){text=hindi?'नमस्ते। मैं यहाँ हूँ। आप दवाएँ, खेल, परिवार या समय के बारे में पूछ सकते हैं।':'Hello. I’m here. You can ask me about medicines, games, family or the time.';}
else{
 try{
  await configReady;if(!active||turn!==generation)return;
  if(!talkConfig?.url)throw Error(hindi?'केयरगिवर से Talk कनेक्ट करने को कहें।':'Ask your caregiver to connect Talk.');
  controller=new AbortController();const timeout=setTimeout(()=>controller?.abort(),25000);
  let response;try{response=await fetch(talkConfig.url+'/talk',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+talkConfig.token},body:JSON.stringify({text:query,language:lang,history}),signal:controller.signal});}finally{clearTimeout(timeout);}
  const result=await response.json();if(!response.ok)throw Error(result.error||words.retry);
  text=result.text;if(!active||turn!==generation)return;history.push({role:'user',text:query},{role:'model',text});history=history.slice(-4);
 }catch(e){if(active&&turn===generation)stop(e.name==='AbortError'?words.retry:(e.message||words.retry));return;}
}
if(!active||turn!==generation)return;document.getElementById('answer').textContent=text;
if(native){state('speaking');native.speak(text,hindi?'hi-IN':'en-IN').then(()=>{if(!active||turn!==generation)return;if(destination){stop();parent.patientNav(...destination)}else timer=setTimeout(listen,700)}).catch(()=>{if(active&&turn===generation)stop(text)});return;}
if(!('speechSynthesis'in window)){stop(text);return}const u=new SpeechSynthesisUtterance(text);u.lang=hindi?'hi-IN':lang==='en'?'en-IN':lang+'-IN';u.rate=.85;state('speaking');u.onend=()=>{if(!active||turn!==generation)return;if(destination){stop();parent.patientNav(...destination)}else timer=setTimeout(listen,450)};u.onerror=()=>{if(active&&turn===generation)stop(words.retry)};speechSynthesis.speak(u)}
orb.onclick=()=>{if(active){stop();return}if(!SR&&!native){state('idle',words.unsupported);return}active=true;generation++;state('listening');listen()};
addEventListener('pagehide',()=>stop());document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='languageChange'){const next=e.data.code||e.data.appLanguage;if(typeof next!=='string'||!next||next===lang)return;stop();lang=next;hindi=lang==='hi';words=labels();document.documentElement.lang=lang;state('idle')}});document.documentElement.lang=lang;state('idle');
</script></body></html>
