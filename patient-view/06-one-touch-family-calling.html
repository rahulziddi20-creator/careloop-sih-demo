<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareLoop · Call family</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#493523;font:18px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px}h1{font-size:28px;margin:0 0 18px}.contact{display:grid;grid-template-columns:84px 1fr;gap:12px;background:white;border:1px solid #e8d2ba;border-radius:20px;padding:16px;margin-bottom:14px}.portrait{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#f4e5d4;display:grid;place-items:center;font-size:30px;font-weight:700}.portrait img{width:100%;height:100%;object-fit:cover}h2{font-size:24px;line-height:1.2;margin:4px 0 6px}p{margin:4px 0;color:#755a41}.call{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:10px;min-height:56px;padding:10px;background:#205f50;color:white;text-decoration:none;border-radius:14px;font-size:22px;font-weight:650}.call svg{width:24px;height:24px}.call:focus-visible{outline:3px solid #8b4f19;outline-offset:3px}.number{font-size:16px;overflow-wrap:anywhere}.missing{grid-column:1/-1;font-size:17px}</style></head><body><main><h1>Call family</h1><div id="contacts"></div></main><script>
const contacts=JSON.parse(CareLoopStorage.getItem('careloop_contacts')||'[]'),family=JSON.parse(CareLoopStorage.getItem('careloop_family_members')||'[]');const host=document.getElementById('contacts');
for(const c of contacts){const card=document.createElement('section');card.className='contact';const portrait=document.createElement('div');portrait.className='portrait';const initials=(c.name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('');portrait.textContent=initials;const matches=family.filter(m=>(m.name||'').trim().toLowerCase()===(c.name||'').trim().toLowerCase());const photo=c.photoUrl||c.avatar||(matches.length===1?matches[0].photoUrl:'');if(photo){const image=document.createElement('img');image.src=photo;image.alt=c.name||'Family';image.onerror=()=>{portrait.textContent=initials};portrait.replaceChildren(image)}const details=document.createElement('div'),name=document.createElement('h2'),relation=document.createElement('p'),number=document.createElement('p');name.textContent=c.name;relation.textContent=c.role||c.relationship||'Family';number.className='number';number.textContent=c.phone||'';details.append(name,relation,number);card.append(portrait,details);const phone=(c.phone||'').replace(/[\s().-]/g,'');if(/^\+?[0-9]{7,15}$/.test(phone)){const a=document.createElement('a');a.className='call';a.href='tel:'+phone;a.setAttribute('aria-label','Call '+c.name);a.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg><span>Call</span>';card.append(a)}else{const p=document.createElement('p');p.className='missing';p.textContent='Your caregiver needs to add a phone number.';card.append(p)}host.append(card)}if(!contacts.length)host.textContent='Your caregiver can add family contacts here.';
</script></body></html>
