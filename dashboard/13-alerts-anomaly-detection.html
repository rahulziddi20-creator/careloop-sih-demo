<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareLoop · Alerts</title><link rel="stylesheet" href="../shared/workspace.css"></head><body><main><div class="eyebrow">Caregiver workspace</div><h1>Routine alerts</h1><p>Reminders from your saved medicine schedule. An unconfirmed dose does not necessarily mean it was missed.</p><section class="card" id="alerts"></section></main><script type="module">
import {doseTimes,dayKey,isTaken} from '../shared/medication-schedule.js';
const meds=JSON.parse(CareLoopStorage.getItem('careloop_medications')||'[]'),now=new Date(),today=dayKey(now),minutes=now.getHours()*60+now.getMinutes(),host=document.getElementById('alerts');
let reviewed=JSON.parse(CareLoopStorage.getItem('careloop_reviewed_alerts')||'[]');
const due=meds.filter(m=>m.status!=='Paused'&&m.regimenStatus!=='Paused').flatMap(m=>doseTimes(m).filter(time=>Number(time.slice(0,2))*60+Number(time.slice(3))<minutes&&!isTaken(m,today,time)).map(time=>({med:m,time})));
if(!due.length)host.textContent='No unconfirmed scheduled doses to review right now.';
for(const {med,time} of due){const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.textContent=med.name+' · '+time+' · Not confirmed';const button=document.createElement('button'),key=today+'_'+med.id+'_'+time;button.textContent=reviewed.includes(key)?'Reviewed':'Mark reviewed';button.disabled=reviewed.includes(key);button.onclick=async()=>{button.disabled=true;try{const next=[...new Set([...reviewed,key])].slice(-300);CareLoopStorage.setItem('careloop_reviewed_alerts',JSON.stringify(next));await CareLoopStorage.flush();reviewed=next;button.textContent='Reviewed'}catch(e){button.disabled=false;alert('Could not save review: '+e.message)}};row.append(label,button);host.append(row)}document.documentElement.classList.toggle('light',CareLoopStorage.getItem('careloop_theme')==='light');
</script></body></html>
