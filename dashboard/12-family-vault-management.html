<!doctype html><html lang="en"><head><script src="/careloop-sih-demo/shared/pages-state.js"></script><link rel="stylesheet" href="/careloop-sih-demo/shared/ui-kit.css"><link rel="stylesheet" href="/careloop-sih-demo/shared/refined.css"><script type="module" src="/careloop-sih-demo/shared/ui-kit.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family photos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#203f35;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:28px;margin:0}p{color:#587268}button,input,select{font:inherit}button{min-height:46px;border:1px solid #bacdc5;background:white;color:#205f50;border-radius:12px;padding:10px 16px;cursor:pointer}.primary{background:#205f50;color:white;border-color:#205f50}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}#family-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.member{background:white;border:1px solid #d8e4dd;border-radius:18px;overflow:hidden}.member img,.placeholder{width:100%;height:200px;object-fit:contain;background:#edf2ef;display:grid;place-items:center}.details{padding:16px}.details h2{margin:0;font-size:21px}.details p{margin:6px 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}dialog{border:1px solid #d8e4dd;border-radius:18px;width:min(460px,calc(100% - 24px));max-height:90dvh;padding:22px;color:#203f35}dialog::backdrop{background:#10251e88}label{display:block;margin:14px 0 5px}input:not([type=checkbox]),select{width:100%;border:1px solid #bacdc5;border-radius:9px;padding:10px;min-height:46px}input[type=file]{padding:8px;font-size:14px}#preview{width:100%;height:150px;object-fit:contain;margin-top:10px;background:#edf2ef;border-radius:12px}#preview[hidden]{display:none}.check{display:flex;gap:10px;align-items:center}.check input{width:22px;height:22px}#error{color:#a02e2e}#status{color:#205f50}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4b8b77;outline-offset:3px}@media(max-width:520px){main{padding:16px}header{align-items:stretch;flex-direction:column;gap:10px}header p{margin:6px 0}h1{font-size:25px}}
</style></head><body><main><header><div><h1>Family photos</h1><p>Add a familiar face, their name and relationship.</p></div><button class="primary" id="add">+ Add family photo</button></header><p id="status" role="status"></p><div id="family-grid"></div></main>
<dialog id="editor"><form id="member-form"><h2 id="editor-title">Add family photo</h2><label for="member-name">Name</label><input id="member-name" required maxlength="80" autocomplete="off"><label for="member-relation">Relationship</label><input id="member-relation" required maxlength="60" placeholder="For example, Brother"><label for="member-photo">Choose photo from this device</label><input id="member-photo" type="file" accept="image/*"><img id="preview" hidden alt="Selected family photo"><p id="photo-help">Choose a clear photo of their face. Your existing photo stays unless you choose another.</p><label class="check"><input id="member-games" type="checkbox">Include in Family Faces game</label><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="save" type="submit">Save photo</button></div></form></dialog>
<script>
const key='careloop_family_members',el=id=>document.getElementById(id);let editing=null,photo='',busy=false;
function members(){try{return JSON.parse(CareLoopStorage.getItem(key)||'[]')}catch{return []}}
function render(){const list=members(),grid=el('family-grid');grid.replaceChildren();if(!list.length){const p=document.createElement('p');p.textContent='No family photos yet. Use Add family photo to get started.';grid.append(p)}for(const member of list){const card=document.createElement('article');card.className='member';const fallback=()=>{const p=document.createElement('div');p.className='placeholder';p.textContent='Add a photo';return p};if(member.photoUrl){const img=document.createElement('img');img.src=member.photoUrl;img.alt=member.name;img.onerror=()=>img.replaceWith(fallback());card.append(img)}else card.append(fallback());const details=document.createElement('div');details.className='details';const h=document.createElement('h2');h.textContent=member.name;const p=document.createElement('p');p.textContent=member.relationship;const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent=member.photoUrl?'Edit photo & details':'Add photo / Edit';edit.onclick=()=>open(member);const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=async()=>{if(!confirm('Remove '+member.name+' from family photos?'))return;try{CareLoopStorage.setItem(key,JSON.stringify(members().filter(m=>m.id!==member.id)));await CareLoopStorage.flush();render();el('status').textContent='Family member removed.'}catch(e){el('status').textContent='Could not save: '+e.message}};actions.append(edit,remove);details.append(h,p,actions);card.append(details);grid.append(card)}}
function open(member){editing=member?.id||null;photo=member?.photoUrl||'';el('member-form').reset();el('member-name').value=member?.name||'';el('member-relation').value=member?.relationship||'';el('member-games').checked=member?.includeInGames||false;el('editor-title').textContent=member?'Edit family photo':'Add family photo';el('error').textContent='';el('preview').hidden=!photo;el('preview').src=photo;el('editor').showModal()}
el('add').onclick=()=>open();el('cancel').onclick=()=>{if(!busy)el('editor').close()};el('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
async function preparePhoto(file){if(!file.type.startsWith('image/'))throw Error('Please choose an image.');if(file.size>20000000)throw Error('Please choose a photo smaller than 20 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);for(const quality of [.85,.65,.45]){const data=canvas.toDataURL('image/jpeg',quality);if(data.length<780000)return data}throw Error('Please choose a smaller photo.')}catch(e){throw Error(e.message==='Please choose a smaller photo.'?e.message:'This image could not be opened. Try a JPG or PNG photo.')}finally{URL.revokeObjectURL(url)}}
el('member-photo').onchange=async()=>{const file=el('member-photo').files[0];if(!file)return;busy=true;el('save').disabled=true;el('error').textContent='Preparing photo…';try{photo=await preparePhoto(file);el('preview').src=photo;el('preview').hidden=false;el('error').textContent=''}catch(e){el('error').textContent=e.message;el('member-photo').value=''}finally{busy=false;el('save').disabled=false}};
el('member-form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!photo){el('error').textContent='Please choose a photo first.';return}busy=true;el('save').disabled=true;el('error').textContent='';try{let savedPhoto=photo;if(photo.startsWith('data:')){const res=await fetch('/api/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'image/jpeg',base64:photo.split(',')[1]})});const result=await res.json();if(!res.ok)throw Error(result.error||'Photo upload failed');savedPhoto=result.url}const list=members(),old=list.find(m=>m.id===editing);const member={...old,id:editing||'member_'+crypto.randomUUID(),name:el('member-name').value.trim(),relationship:el('member-relation').value.trim(),photoUrl:savedPhoto,includeInGames:el('member-games').checked,addedAt:old?.addedAt||new Date().toISOString()};if(!member.name||!member.relationship)throw Error('Enter a name and relationship.');const index=list.findIndex(m=>m.id===editing);if(index<0)list.push(member);else list[index]=member;CareLoopStorage.setItem(key,JSON.stringify(list));await CareLoopStorage.flush();el('editor').close();render();el('status').textContent='Photo saved. It is now available in patient Family Photos.'}catch(e){el('error').textContent='Could not save: '+e.message}finally{busy=false;el('save').disabled=false}};render();
</script></body></html>
